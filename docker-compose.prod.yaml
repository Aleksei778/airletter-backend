# Production stack. Deployed by .github/workflows/ci-cd.yml into DEPLOY_PATH on the server
# together with .env (APP_IMAGE is appended to .env on deploy).
# TLS and routing are done by Nginx Proxy Manager on shared_network: forward to airletter-api:8080.
name: airletter
services:
  app:
    image: ${APP_IMAGE}
    command: ["api"]
    env_file: .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      default:
      shared_network:
        aliases: [airletter-api]

  worker:
    image: ${APP_IMAGE}
    command: ["worker"]
    env_file: .env
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASS}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      default:
        aliases: [airletter-db]

  redis:
    image: redis:8.4.0
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      default:
        aliases: [airletter-redis]

  # reachable only from the server itself: ssh -L 8090:localhost:8090 user@host
  asynqmon:
    image: hibiken/asynqmon:0.7.2
    platform: linux/amd64
    command: ["--redis-url=${REDIS_URL}"]
    ports:
      - "127.0.0.1:8090:8080"
    restart: unless-stopped
    depends_on:
      - redis

networks:
  # created outside this stack: docker network create shared_network
  shared_network:
    external: true

volumes:
  postgres_data:
  redis_data:
