name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase repository name
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/prod/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/airletter' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare release files
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          mkdir release
          cp docker-compose.prod.yaml release/docker-compose.yaml
          cp docker/nginx/nginx.conf release/nginx.conf
          printf '%s\n' "$PROD_ENV_FILE" > release/.env
          echo "APP_IMAGE=${{ needs.build.outputs.image }}:${{ github.sha }}" >> release/.env

      - name: Upload release files
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            release/docker-compose.yaml release/nginx.conf release/.env \
            "$SSH_TARGET:$DEPLOY_PATH/"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" bash -s <<EOF
          set -euo pipefail
          cd '$DEPLOY_PATH'
          chmod 600 .env
          docker network inspect shared_network >/dev/null 2>&1 || docker network create shared_network
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker compose pull app worker
          docker compose up -d --remove-orphans --wait app
          docker compose up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -f
          EOF
